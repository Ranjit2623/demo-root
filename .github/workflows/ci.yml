name: Root Platform CI/CD

on:
  push:
    branches:
      - ranjit
      - master
      - dev
  pull_request:
    branches:
      - ranjit
      - master
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config
